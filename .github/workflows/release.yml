name: Release

# Builds Port Manager for the Miyoo Mini Plus, runs emulator verification tests,
# packages the SD card release archive (App/ and Roms/), and publishes a GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Emulator verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and dependencies (cache)
        uses: actions/cache@v4
        with:
          path: miyoo/emu/deps
          key: miyoo-deps-${{ runner.arch }}-${{ hashFiles('miyoo/emu/setup.sh') }}

      - name: Setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash miyoo/emu/setup.sh

      - name: Build emulator binary
        run: EMU=1 bash src/build.sh

      - name: Test in emulator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 miyoo/emu/miyoo-emu.py run --bin build/miyoo_emu/portmanager_emu

  release:
    name: Build & Publish Release
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ZIP_VERSIONED=PortManager-Miyoo-${TAG}.zip" >> "$GITHUB_OUTPUT"
          echo "ZIP_LATEST=PortManager-Miyoo.zip" >> "$GITHUB_OUTPUT"

      - name: Toolchain and dependencies (cache)
        uses: actions/cache@v4
        with:
          path: miyoo/emu/deps
          key: miyoo-deps-${{ runner.arch }}-${{ hashFiles('miyoo/emu/setup.sh') }}

      - name: Setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash miyoo/emu/setup.sh

      - name: Build device binary
        run: bash src/build.sh

      - name: Ensure CA certificate bundle
        run: |
          if [ ! -s onion/App/PortManager/cacert.pem ]; then
            echo "Fetching Mozilla CA certificate bundle..."
            curl -fsSL --retry 3 https://curl.se/ca/cacert.pem -o onion/App/PortManager/cacert.pem
          fi

      - name: Package release ZIP
        run: |
          chmod +x onion/App/PortManager/portmanager onion/App/PortManager/launch.sh
          cp -f catalog.json onion/App/PortManager/catalog.json
          
          ZIP_VER="${{ steps.vars.outputs.ZIP_VERSIONED }}"
          ZIP_LATEST="${{ steps.vars.outputs.ZIP_LATEST }}"
          
          cd onion
          zip -r "../${ZIP_VER}" App/ Roms/
          cp -f "../${ZIP_VER}" "../${ZIP_LATEST}"
          cd ..
          
          echo "=== Release archives created ==="
          ls -lh "${ZIP_VER}" "${ZIP_LATEST}"
          unzip -l "${ZIP_VER}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.ZIP_VERSIONED }}
          path: |
            ${{ steps.vars.outputs.ZIP_VERSIONED }}
            ${{ steps.vars.outputs.ZIP_LATEST }}
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          ZIP_VER="${{ steps.vars.outputs.ZIP_VERSIONED }}"
          ZIP_LATEST="${{ steps.vars.outputs.ZIP_LATEST }}"
          
          ARGS=()
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            ARGS+=("--draft")
          fi
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            ARGS+=("--prerelease")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" "$ZIP_VER" "$ZIP_LATEST" --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" "$ZIP_VER" "$ZIP_LATEST" \
              --title "Port Manager $TAG" \
              --generate-notes \
              "${ARGS[@]}"
          fi
